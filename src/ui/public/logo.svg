<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 11 100 100" width="100" height="100" role="img" aria-label="SplitCortex">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#4f5df0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3be8d0"/>
      <stop offset="1" stop-color="#14b8d4"/>
    </linearGradient>
  </defs>


  <!-- left hemisphere: organic brain -->
  <path d="M60 28
           C50 22 36 25 32 36
           C22 38 17 49 22 58
           C16 66 19 78 28 82
           C29 93 40 99 49 95
           C54 100 60 98 60 92 Z"
        fill="url(#left)"/>
