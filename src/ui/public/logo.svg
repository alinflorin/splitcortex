  <g fill="none" stroke="#0e1330" stroke-width="3.5" stroke-linecap="round" opacity=".55">
    <path d="M32 36 C38 40 42 46 40 52"/>
    <path d="M22 58 C30 58 36 62 38 68"/>
    <path d="M28 82 C35 80 41 76 42 70"/>
    <path d="M49 95 C48 88 51 82 56 80"/>
    <path d="M60 46 C52 46 47 50 47 56"/>
  </g>

  <!-- right hemisphere: circuit/compute -->
  <path d="M68 28
           C78 22 92 25 96 36
           C106 38 111 49 106 58
           C112 66 109 78 100 82
           C99 93 88 99 79 95
           C74 100 68 98 68 92 Z"
        fill="url(#right)"/>
  <g fill="none" stroke="#0e1330" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
    <path d="M68 46 H82 L88 52 V60"/>
    <path d="M68 64 H92"/>
    <path d="M68 80 H80 L86 74 H98"/>
  </g>
  <g fill="#0e1330">
    <circle cx="88" cy="62" r="4"/>
    <circle cx="94" cy="64" r="0"/>
    <circle cx="98" cy="74" r="4"/>
    <circle cx="82" cy="46" r="0"/>
  </g>
  <g fill="#e8fffb">
    <circle cx="88" cy="62" r="1.8"/>
    <circle cx="98" cy="74" r="1.8"/>
  </g>
</svg>
