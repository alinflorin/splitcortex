[package]
name = "splitcortex-desktop-node"
version = "0.0.0"
description = "SplitCortex desktop node"
authors = ["SplitCortex"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "splitcortex_desktop_node_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# `rustls-tls-native-roots` instead of the default `rustls-tls` (a bundled Mozilla list): the control plane calls must
# trust the operating system's certificate store, so a private or corporate CA (and the local/CI stacks) works.
tauri-plugin-http = { version = "2", default-features = false, features = ["stream", "rustls-tls-native-roots", "http2", "charset", "system-proxy", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
libloading = "0.9"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
keepawake = "0.6"
log = "0.4"
tauri-plugin-log = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
# Thin LTO with parallel codegen: far faster release builds than fat LTO + one unit; inference runs in the LiteRT library, not here.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
