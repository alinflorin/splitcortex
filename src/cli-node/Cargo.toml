[package]
name = "splitcortex-node"
version = "0.0.0" # set from the release tag by CI (scripts/set-version.py)
description = "SplitCortex command line node"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
curve25519-dalek = { version = "4", features = ["rand_core"] }
directories = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
futures-util = "0.3"
hkdf = "0.13"
keepawake = "0.6"
libloading = "0.8"
prost = "0.13"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
