// The node protocol: what a node (phone, RPi) and the gateway say to each other over one long-lived WebSocket (wss).
// Every binary WebSocket frame carries exactly one `Envelope`. The schema is transport-independent (a different
// transport can carry the same envelopes) and versioned by the package name; additive changes only.
//
// Handshake (mutual proof of possession; no secret is ever sent, TLS is not the only protection):
//   node    -> ClientHello  { node_id, nonce }
//   gateway -> ServerHello  { nonce, signature }   signature = Ed25519(gateway key, "splitcortex-gateway-hello-v1\n" node_nonce "\n" node_id)
//                                                  the node verifies it against the gateway key it pinned at enrollment
//   node    -> ClientAuth   { signature }          signature = Ed25519(device key, "splitcortex-node-hello-v1\n" server_nonce "\n" node_nonce "\n" node_id)
//   gateway -> Ready        { ... }                or the socket is closed (no reason is given for auth failures)
// Identity comes from the registered device key, never from later messages.
syntax = "proto3";

package splitcortex.node.v1;

message Envelope {
  oneof body {
    ClientHello client_hello = 1;
    ServerHello server_hello = 2;
    ClientAuth client_auth = 3;
    Ready ready = 4;
    ModelAssignment model_assignment = 5;
    ModelState model_state = 6;
    Telemetry telemetry = 7;
    Ping ping = 8;
    Pong pong = 9;
    InferenceRequest inference_request = 10;
    InferenceChunk inference_chunk = 11;
    InferenceDone inference_done = 12;
    InferenceError inference_error = 13;
    Cancel cancel = 14;
    NodeConfig node_config = 15;
    Resume resume = 16;
    ResumeAck resume_ack = 17;
    GatewayKeys gateway_keys = 18;
  }
}

message ClientHello {
  uint32 protocol_version = 1;
  string node_id = 2;
  bytes nonce = 3; // 32 random bytes
  string app_version = 4;
}

message ServerHello {
  bytes nonce = 1; // 32 random bytes
  bytes signature = 2;
}

message ClientAuth {
  bytes signature = 1;
}

// Sent once after a successful handshake.
message Ready {
  // Requests the gateway may have in flight on this node at once (credit-based backpressure, 1 for a phone).
  uint32 max_in_flight = 1;
  uint32 ping_interval_seconds = 2;
  // Key rotation (see docs/gateway.md): while the operator rolls the gateway identity, the gateway announces the key it
  // is about to switch to, signed by its current key (which the node pinned), so the node can trust both during the
  // overlap. Empty when no rotation is under way.
  //   next_gateway_key_signature = Ed25519(current key, "splitcortex-gateway-next-key-v1\n" node_nonce "\n" next_gateway_key)
  bytes next_gateway_key = 3;
  bytes next_gateway_key_signature = 4;
}

// node -> gateway, sent right after Ready on every (re)connect: the requests the node still holds (generating, or
// finished but not known to be received). The gateway answers with a ResumeAck for the ones it still tracks and
// cancels the rest. Chunks, Done and Error carry a per-request `seq` (1, 2, 3, ...) so the node can resend what the
// gateway missed and the gateway can drop duplicates.
message Resume {
  repeated string request_ids = 1;
}

message ResumeEntry {
  string request_id = 1;
  uint32 received_seq = 2; // the highest seq the gateway has; the node resends everything above it
}

message ResumeAck {
  repeated ResumeEntry entries = 1;
}

// node -> gateway, after Ready: ids (first 8 bytes of SHA-256 of the public key) of the gateway keys this device trusts.
// Lets the operator see whether every device learned the next key before promoting it.
message GatewayKeys {
  repeated bytes key_ids = 1;
}

// What the node's pool serves (gateway -> node). Sent after Ready and again whenever it changes; an empty
// `model_id` means the pool serves nothing. The node downloads the file from the control plane (never through the
// gateway), verifies `sha256`, replaces the previous model and reports `ModelState`.
message ModelAssignment {
  string model_id = 1;
  string name = 2;
  string file_name = 3;
  uint64 size_bytes = 4;
  string sha256 = 5; // hex, may be empty when unknown
}

// Admin overrides for this device (gateway -> node). Sent after Ready and whenever they change; the node applies
// them over its own settings and reloads the engine if the effective values changed. Zero values mean "no override":
// the node uses its own setting, which is `auto` by default (it measures and picks the fastest backend).
message NodeConfig {
  string backend = 1;              // "" | "cpu" | "gpu"
  uint32 max_context_tokens = 2;   // 0 = no override
}

enum ModelPhase {
  MODEL_PHASE_UNSPECIFIED = 0;
  MODEL_PHASE_NONE = 1;
  MODEL_PHASE_DOWNLOADING = 2;
  MODEL_PHASE_LOADING = 3;
  MODEL_PHASE_READY = 4;
  MODEL_PHASE_FAILED = 5;
}

// node -> gateway. Requests are routed to a node only while it reports READY for the assigned model.
message ModelState {
  string model_id = 1;
  ModelPhase phase = 2;
  uint64 progress_bytes = 3;
  string error = 4;
}

// Unknown values: cpu_percent < 0, memory_used_mb = 0, battery_percent < 0 (charging is then meaningless),
// temperature_c <= -100. The gateway stores them as null.
message Telemetry {
  double cpu_percent = 1;     // of the whole device (all cores), 0-100
  uint32 memory_used_mb = 2;  // resident memory of the node app, including the loaded model
  int32 battery_percent = 3;
  bool charging = 4;
  double temperature_c = 5;   // battery temperature
  double tokens_per_sec = 6;
  string backend = 7;             // what the engine actually runs on: "cpu" | "gpu" ("" = unknown / no model loaded)
  uint32 max_context_tokens = 8;  // the engine's context window in tokens (0 = unknown). The gateway only routes a
                                  // request here when its estimated prompt + output fits.
}

message Ping {
  uint64 timestamp_ms = 1;
}

message Pong {
  uint64 timestamp_ms = 1;
}

message ChatMessage {
  string role = 1; // system | user | assistant
  string content = 2;
}

// Every message below carries the request id, so many requests share the one socket.
message InferenceRequest {
  string request_id = 1;
  string model_id = 2;
  repeated ChatMessage messages = 3;
  uint32 max_tokens = 4; // 0 = engine default
  float temperature = 5; // 0 = engine default
  float top_p = 6;       // 0 = engine default
}

message InferenceChunk {
  string request_id = 1;
  string text = 2;
  uint32 seq = 3;
}

message InferenceDone {
  string request_id = 1;
  uint32 prompt_tokens = 2;
  uint32 completion_tokens = 3;
  string finish_reason = 4; // stop | length
  uint32 seq = 5;
}

message InferenceError {
  string request_id = 1;
  string code = 2;
  string message = 3;
  uint32 seq = 4;
}

// gateway -> node: the client went away, stop generating.
message Cancel {
  string request_id = 1;
}
