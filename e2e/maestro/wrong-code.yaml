# A code that does not exist is refused with the generic message.
appId: com.splitcortex.node
---
- launchApp:
    clearState: true
- tapOn: 'Enroll device'
- tapOn: 'Enrollment code'
- inputText: 'ZZZZZZZZZZ'
# No hideKeyboard: on Android it sends Back, which leaves the screen when the keyboard is not showing (ATD image).
# The ATD emulator screen is small: the form scrolls, and Maestro only sees what is on screen.
- scrollUntilVisible:
    element: 'Enrollment URL'
    visibilityPercentage: 60
- tapOn: 'Enrollment URL'
- eraseText: 100
- inputText: ${API_URL}
- scrollUntilVisible:
    element: 'Enroll'
- tapOn: 'Enroll'
# The message may be below the fold on a small screen; scrolling also waits for it to appear.
- scrollUntilVisible:
    element: 'This code is not valid, has expired or was already used.'
    timeout: 60000
