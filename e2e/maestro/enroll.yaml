# Enroll the app with a code from the pool, then check the status screen.
# maestro test -e CODE=XXXX-XXXXXX -e API_URL=https://app.example.com/api maestro/enroll.yaml
appId: com.splitcortex.node
---
- launchApp:
    clearState: true
- tapOn: 'Enroll device'
- tapOn: 'Enrollment code'
- inputText: ${CODE}
# No hideKeyboard: on Android it sends Back, which leaves the screen when the keyboard is not showing (ATD image).
# The ATD emulator screen is small: the form scrolls, and Maestro only sees what is on screen.
- takeScreenshot: before-url
- scrollUntilVisible:
    element: 'Enrollment URL'
    visibilityPercentage: 60
- tapOn: 'Enrollment URL'
- eraseText: 100
- inputText: ${API_URL}
- scrollUntilVisible:
    element: 'Enroll'
- tapOn: 'Enroll'
# Either the status screen or a system permission prompt (Android asks for notifications once the node starts); a prompt
# hides the app's text from Maestro, so allow it first.
- extendedWaitUntil:
    visible: 'Allow|Enrolled.*'
    timeout: 60000
- runFlow:
    when:
      visible: 'Allow'
    commands:
      - tapOn: 'Allow'
- extendedWaitUntil:
    visible: 'Enrolled.*'
    timeout: 30000
- takeScreenshot: enrolled
# Maestro matches whole strings as regexes; the app shows "Key fingerprint: <value>" as one text.
- assertVisible: 'Key fingerprint.*'
