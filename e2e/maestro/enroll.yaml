# Enroll the app with a code from the pool, then check the status screen.
# maestro test -e CODE=XXXX-XXXXXX -e API_URL=https://app.example.com/api maestro/enroll.yaml
appId: com.splitcortex.node
---
- launchApp:
    clearState: true
# The deep link fills in the code and the server URL (typing into the URL field is fragile: eraseText only deletes
# backwards from the cursor). The wrong-code flow covers typing into the form.
- openLink: 'splitcortex://enroll?code=${CODE}&url=${API_URL}'
- extendedWaitUntil:
    visible: 'Enrollment code'
    timeout: 30000
- scrollUntilVisible:
    element: 'Enroll'
- tapOn: 'Enroll'
# Either the status screen or a system permission prompt (Android asks for notifications once the node starts); a prompt
# hides the app's text from Maestro, so allow it first.
- extendedWaitUntil:
    visible: 'Allow|Enrolled.*'
    timeout: 60000
- runFlow:
    when:
      visible: 'Allow'
    commands:
      - tapOn: 'Allow'
- extendedWaitUntil:
    visible: 'Enrolled.*'
    timeout: 30000
- takeScreenshot: enrolled
# Maestro matches whole strings as regexes; the app shows "Key fingerprint: <value>" as one text.
- assertVisible: 'Key fingerprint.*'
