apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuerName }}
spec:
  acme:
    email: {{ required "email is required" .Values.email | quote }}
    server: {{ .Values.server | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuerName }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClass | quote }}
