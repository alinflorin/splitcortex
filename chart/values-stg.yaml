# Enables the `letsencrypt` ClusterIssuer (Let's Encrypt production).
# Placeholder substituted at deploy time (`envsubst '$LETSENCRYPT_EMAIL'`, from a CI variable); never commit the real value.
letsencryptEmail: "${LETSENCRYPT_EMAIL}"

dex:
  # Google client credentials are placeholders substituted at deploy time (`envsubst`, GitHub environment secrets
  # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET); never commit the real values.
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    hosts:
      - host: dex.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dex-tls
        hosts:
          - dex.stg.splitcortex.alinflorinciu.qoffice.ro
  config:
    issuer: https://dex.stg.splitcortex.alinflorinciu.qoffice.ro
    connectors:
      - type: google
        id: google
        name: Google
        config:
          clientID: "${GOOGLE_CLIENT_ID}"
          clientSecret: "${GOOGLE_CLIENT_SECRET}"
          redirectURI: https://dex.stg.splitcortex.alinflorinciu.qoffice.ro/callback
    # The user the end-to-end tests (e2e/) sign in with: GitHub `stg` environment secrets E2E_EMAIL and E2E_PASSWORD;
    # deploy.yaml bcrypt-hashes the password into E2E_PASSWORD_HASH. Placeholders, never commit real values.
    staticPasswords:
      - email: "${E2E_EMAIL}"
        hash: "${E2E_PASSWORD_HASH}"
        username: e2e
        userID: 3b9c1f7e-5d2a-4e6b-9a41-8c7d0e2f1a63
    web:
      http: 0.0.0.0:5556
    staticClients:
      - id: splitcortex-ui
        name: SplitCortex Web
        public: true
        redirectURIs:
          - https://app.stg.splitcortex.alinflorinciu.qoffice.ro/
          - https://app.stg.splitcortex.alinflorinciu.qoffice.ro/api/docs/static/oauth2-redirect.html

ui:
  image:
    repository: ghcr.io/alinflorin/splitcortex-ui
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: app.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - app.stg.splitcortex.alinflorinciu.qoffice.ro

webNode:
  image:
    repository: ghcr.io/alinflorin/splitcortex-web-node
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: web-node.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: web-node-tls
        hosts:
          - web-node.stg.splitcortex.alinflorinciu.qoffice.ro

gateway:
  image:
    repository: ghcr.io/alinflorin/splitcortex-gateway
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: gateway.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gateway-tls
        hosts:
          - gateway.stg.splitcortex.alinflorinciu.qoffice.ro
  appIngress:
    hosts:
      - host: app.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /v1
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - app.stg.splitcortex.alinflorinciu.qoffice.ro

controlPlane:
  gateway:
    url: wss://gateway.stg.splitcortex.alinflorinciu.qoffice.ro/node
  image:
    repository: ghcr.io/alinflorin/splitcortex-control-plane
  ingress:
    hosts:
      - host: app.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /api
            pathType: Prefix
      - host: web-node.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /api
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - app.stg.splitcortex.alinflorinciu.qoffice.ro
      - secretName: web-node-tls
        hosts:
          - web-node.stg.splitcortex.alinflorinciu.qoffice.ro

dev:
  coredns:
    enabled: false

# k3s ServiceLB (klipper) is plain L4 forwarding: with the default `Cluster` policy Traefik sees a node IP instead of the
# client, so every per-IP limit (enrollment!) collapses into one bucket. `Local` keeps the client address.
traefik:
  service:
    spec:
      externalTrafficPolicy: Local
