# Enables the `letsencrypt` ClusterIssuer (Let's Encrypt production).
# Placeholder substituted at deploy time (`envsubst '$LETSENCRYPT_EMAIL'`, from a CI variable); never commit the real value.
letsencryptEmail: "${LETSENCRYPT_EMAIL}"

dex:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    hosts:
      - host: dex.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dex-tls
        hosts:
          - dex.stg.splitcortex.alinflorinciu.qoffice.ro
  config:
    issuer: https://dex.stg.splitcortex.alinflorinciu.qoffice.ro
    web:
      http: 0.0.0.0:5556
    staticClients:
      - id: splitcortex-ui
        name: SplitCortex Web
        public: true
        redirectURIs:
          - https://app.stg.splitcortex.alinflorinciu.qoffice.ro/
          - https://app.stg.splitcortex.alinflorinciu.qoffice.ro/api/docs/static/oauth2-redirect.html

ui:
  image:
    repository: ghcr.io/alinflorin/splitcortex-ui
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: app.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - app.stg.splitcortex.alinflorinciu.qoffice.ro


gateway:
  image:
    repository: ghcr.io/alinflorin/splitcortex-gateway
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: gateway.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gateway-tls
        hosts:
          - gateway.stg.splitcortex.alinflorinciu.qoffice.ro

controlPlane:
  gateway:
    url: wss://gateway.stg.splitcortex.alinflorinciu.qoffice.ro/node
  image:
    repository: ghcr.io/alinflorin/splitcortex-control-plane
  ingress:
    hosts:
      - host: app.stg.splitcortex.alinflorinciu.qoffice.ro
        paths:
          - path: /api
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - app.stg.splitcortex.alinflorinciu.qoffice.ro

dev:
  coredns:
    enabled: false
