global:
  domain: splitcortex.com

# `letsencrypt` ClusterIssuer (Let's Encrypt production, DNS-01 through Cloudflare; the zone of `global.domain` must be in
# that Cloudflare account). Placeholder substituted at deploy time (`envsubst`, GitHub secret CLOUDFLARE_TOKEN); never
# commit the real value.
cloudflareApiToken: "${CLOUDFLARE_TOKEN}"

dex:
  config:
    # Google client credentials: placeholders substituted at deploy time (GitHub environment secrets
    # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET); never commit the real values.
    connectors:
      - type: google
        id: google
        name: Google
        config:
          clientID: "${GOOGLE_CLIENT_ID}"
          clientSecret: "${GOOGLE_CLIENT_SECRET}"
          redirectURI: "https://dex.{{ .Values.global.domain }}/callback"
    web:
      http: 0.0.0.0:5556
    staticClients:
      - id: splitcortex-ui
        name: SplitCortex Web
        public: true
        redirectURIs:
          - "https://{{ .Values.global.domain }}/"
          - "https://{{ .Values.global.domain }}/api/docs/static/oauth2-redirect.html"

ui:
  image:
    repository: ghcr.io/alinflorin/splitcortex-ui
  analytics:
    measurementId: G-KYDDYPE4NM   # Google Analytics 4 stream of the web app (a public id, not a secret)
  seo:
    indexable: true   # the only environment that may appear in search results

webNode:
  image:
    repository: ghcr.io/alinflorin/splitcortex-web-node
  analytics:
    measurementId: G-DY77W04DVM   # Google Analytics 4 stream of the web node (a public id, not a secret)

gateway:
  image:
    repository: ghcr.io/alinflorin/splitcortex-gateway

controlPlane:
  image:
    repository: ghcr.io/alinflorin/splitcortex-control-plane

dev:
  coredns:
    enabled: false

# k3s ServiceLB (klipper) is plain L4 forwarding: with the default `Cluster` policy Traefik sees a node IP instead of the
# client, so every per-IP limit (enrollment!) collapses into one bucket. `Local` keeps the client address.
traefik:
  service:
    spec:
      externalTrafficPolicy: Local
