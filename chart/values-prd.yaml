# Enables the `letsencrypt` ClusterIssuer (Let's Encrypt production).
# Placeholder substituted at deploy time (`envsubst '$LETSENCRYPT_EMAIL'`, from a CI variable); never commit the real value.
letsencryptEmail: "${LETSENCRYPT_EMAIL}"

dex:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    hosts:
      - host: dex.prd.splitcortex.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dex-tls
        hosts:
          - dex.prd.splitcortex.com
  config:
    issuer: https://dex.prd.splitcortex.com
    web:
      http: 0.0.0.0:5556
      allowedOrigins:
        - https://app.prd.splitcortex.com
    staticClients:
      - id: splitcortex-ui
        name: SplitCortex Web
        public: true
        redirectURIs:
          - https://app.prd.splitcortex.com/
          - https://app.prd.splitcortex.com/api/docs/static/oauth2-redirect.html

ui:
  image:
    repository: ghcr.io/alinflorin/splitcortex-ui
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: app.prd.splitcortex.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - app.prd.splitcortex.com

controlPlane:
  image:
    repository: ghcr.io/alinflorin/splitcortex-control-plane
  ingress:
    hosts:
      - host: app.prd.splitcortex.com
        paths:
          - path: /api
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - app.prd.splitcortex.com

dev:
  coredns:
    enabled: false
