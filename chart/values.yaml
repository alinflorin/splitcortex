# Ingress controller. Bundled Traefik by default; for an external controller set `traefik.enabled: false`,
# `ingress.className` to its IngressClass, and `rateLimit.enabled: false` unless it is Traefik with its CRDs installed
# (also replace the traefik.ingress.kubernetes.io/* annotations on the Ingresses, e.g. dex.ingress.annotations).
ingress:
  className: traefik

traefik:
  fullnameOverride: traefik   # no release prefix on names (Service `traefik`, used by the dev CoreDNS rewrite)
  enabled: true
  ingressClass:
    # Fixed name so Ingresses and the ACME HTTP-01 solver do not depend on the release name.
    # Keep equal to ingress.className.
    name: traefik
  ports:
    web:
      http:
        redirections:
          # Redirect all HTTP (80) to HTTPS (443) for every Ingress. cert-manager HTTP-01 still works
          # (Let's Encrypt follows redirects). Permanent (301) in all environments.
          entryPoint:
            to: websecure
            scheme: https
            permanent: true

# ClusterIssuers (templates/cluster-issuers.yaml). For an external cert-manager set `cert-manager.enabled: false`
# (its CRDs/webhook must already exist; issuer names `root-ca-issuer`/`letsencrypt` must not clash). To use the
# external cert-manager's own issuers instead, also set `clusterIssuers.enabled: false` and point
# `dex.ingress.annotations."cert-manager.io/cluster-issuer"` (and its TLS) at them.
clusterIssuers:
  enabled: true

cert-manager:
  enabled: true
  # Resource and pod names are `cert-manager`, `cert-manager-webhook`, ... without the release prefix.
  fullnameOverride: cert-manager
  # Install and keep the CRDs with the release (cert-manager is unusable without them).
  crds:
    enabled: true

postgres:
  enabled: true
  # Service is reachable as `postgres` (also used in the DATABASE_URL of the credentials Secret).
  fullnameOverride: postgres
  # Credentials come from the random `postgres-credentials` Secret (templates/postgres-credentials.yaml).
  settings:
    existingSecret: postgres-credentials
    superuser:
      secretKey: superuser
    superuserPassword:
      secretKey: superuser-password
  userDatabase:
    existingSecret: postgres-credentials
    name:
      secretKey: database
    user:
      secretKey: username
    password:
      secretKey: password
  storage:
    requestedSize: 1Gi

dex:
  enabled: true
  fullnameOverride: dex   # Service `dex` (in-cluster JWKS URL of the control plane)
  image:
    tag: latest
    pullPolicy: IfNotPresent   # `latest` is a moving tag; re-pull on every pod start
  ingress:
    enabled: true
    className: traefik   # IngressClass created by the Traefik subchart (traefik.ingressClass.name)
    annotations:
      cert-manager.io/cluster-issuer: root-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      # <release namespace>-rate-limit-general@kubernetescrd (namespace `splitcortex`)
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    hosts:
      - host: dex.splitcortex.127.0.0.1.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dex-tls
        hosts:
          - dex.splitcortex.127.0.0.1.nip.io
  config:
    # Public URL of Dex (must match what clients/browsers reach); override per environment.
    issuer: https://dex.splitcortex.127.0.0.1.nip.io
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
      # CORS is wide open (Dex cannot turn it off; an empty list blocks browsers): the SPA and Swagger UI call
      # Dex's discovery/token endpoints from the browser. Dex uses no cookies on these endpoints.
      allowedOrigins:
        - "*"
      # Dex rejects (403) preflights asking for any header not listed here (no wildcard support).
      allowedHeaders:
        - Accept
        - Accept-Language
        - Authorization
        - Cache-Control
        - Content-Language
        - Content-Type
        - If-Match
        - If-None-Match
        - Origin
        - Pragma
        - X-Requested-With
        - X-CSRF-Token
    staticClients:
      # Web app (SPA, authorization code + PKCE, no client secret). The UI derives the Dex URL from its own
      # host (`app.` -> `dex.`), so keep hostnames in sync. Lists are replaced, not merged, per environment.
      - id: splitcortex-ui
        name: SplitCortex Web
        public: true
        redirectURIs:
          - https://app.splitcortex.127.0.0.1.nip.io/
          - http://app.splitcortex.127.0.0.1.nip.io:5173/
          - https://app.splitcortex.127.0.0.1.nip.io/api/docs/static/oauth2-redirect.html
    enablePasswordDB: true
    oauth2:
      # No "Grant access" screen: our own first-party clients are trusted.
      skipApprovalScreen: true
    expiry:
      # Access tokens are ID-token lifetime in Dex.
      idTokens: 15m
      refreshTokens:
        validIfNotUsedFor: 2160h   # ~3 months
        absoluteLifetime: 2160h    # ~3 months

# Web app (src/ui): static SPA served by Caddy on port 8080. TLS and rate limiting are done by the ingress.
ui:
  enabled: true
  replicaCount: 1
  image:
    repository: splitcortex/ui   # Tilt rebuilds and substitutes this image locally
    tag: ""                      # default: chart appVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
  readOnlyRootFilesystem: true   # Tilt dev sets false (Vite writes caches, live_update syncs files)
  ingress:
    enabled: true
    className: traefik   # keep equal to ingress.className
    annotations:
      cert-manager.io/cluster-issuer: root-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    # The UI derives the Dex URL from this host (`app.` -> `dex.`) and must be listed in Dex's staticClients.
    hosts:
      - host: app.splitcortex.127.0.0.1.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - app.splitcortex.127.0.0.1.nip.io

# Garage: single-node S3-compatible object storage for model files (subchart `garage` 2.5.0 from https://charts.derwitt.dev, a thin
# wrapper around upstream Garage; `dxflrs/garage` is multi-arch, the chart default is amd64-only). It is internal only: no ingress,
# the control plane streams uploads and Hugging Face mirrors into it. The subchart does not bootstrap anything, so a Helm hook
# Job (templates/garage-bootstrap-job.yaml, control plane image) applies the layout and creates the key and bucket through the admin API. Credentials
# are random and live in the `garage-credentials` Secret (templates/garage-credentials.yaml).
garage:
  enabled: true
  fullnameOverride: garage     # Service name the control plane uses (S3_ENDPOINT http://garage:3900)
  bucket: models               # created by the control plane (S3_BUCKET)
  bootstrap:
    command: [node, dist/storage/bootstrap-cli.js]   # run with the control plane image (Tilt overrides it to use tsx)
  capacityGiB: 20              # declared layout capacity; keep <= persistence.data.size
  image:
    repository: dxflrs/garage
  deployment:
    replicaCount: 1
  garage:
    replicationFactor: "1"
    rpc:
      secret:
        create: false
        name: garage-credentials   # key rpcSecret
    admin:
      token:
        create: true
        secret:
          create: false
          name: garage-credentials # key token
  service:
    admin:
      enabled: true            # ClusterIP only (garage-admin:3903), used by the control plane bootstrap
  persistence:
    meta:
      size: 1Gi
    data:
      size: 20Gi

# Control plane (src/control-plane): Fastify REST API under /api (Swagger UI at /api/docs), Drizzle migrations
# run by a Helm hook Job. The OIDC issuer comes from dex.config.issuer; DATABASE_URL from the postgres Secret.
controlPlane:
  enabled: true
  replicaCount: 1
  logLevel: info
  image:
    repository: splitcortex/control-plane   # Tilt rebuilds and substitutes this image locally
    tag: ""                                 # default: chart appVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
  readOnlyRootFilesystem: true   # Tilt dev sets false (tsx watch)
  database:
    existingSecret: postgres-credentials   # generated by templates/postgres-credentials.yaml
    key: DATABASE_URL
  oidc:
    audience: splitcortex-ui   # the Dex client id of the web app (`aud` of its tokens)
    jwksUrl: ""                # default: http://dex:5556/keys (in-cluster, no public TLS needed)
  migrate:
    enabled: true
    command: [node, dist/db/migrate.js]
  ingress:
    enabled: true
    className: traefik   # keep equal to ingress.className
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    # Same host as the web app (same origin, no CORS). The TLS Secret is issued via the UI's Ingress.
    hosts:
      - host: app.splitcortex.127.0.0.1.nip.io
        paths:
          - path: /api
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - app.splitcortex.127.0.0.1.nip.io

# Traefik rate limits (templates/rate-limits.yaml). Not attached to an entryPoint: reference them from each route.
rateLimit:
  # Requires Traefik's CRDs (bundled or external). Disable for a non-Traefik ingress controller.
  enabled: true
  # Number of trusted proxy hops in X-Forwarded-For (0 = use the direct peer address).
  ipDepth: 0
  # Web app, control plane, Dex: per client IP.
  general:
    average: 50     # requests per period, sustained
    period: 1s
    burst: 100
  # Gateway: a coarse per-API-key flood ceiling only; keep it far above real traffic.
  gateway:
    average: 2000
    period: 1s
    burst: 4000

# Dev-only helpers. Keep disabled in stg/prd (set in values-stg.yaml / values-prd.yaml).
dev:
  coredns:
    # k3s: add a `coredns-custom` ConfigMap in kube-system so these hostnames resolve to Traefik inside pods too.
    # Replaces any existing `coredns-custom` ConfigMap; k3s CoreDNS may need a restart to pick it up
    # (`kubectl -n kube-system rollout restart deploy coredns`).
    enabled: true
    # Service the hosts are rewritten to. Default: traefik.<namespace>.svc.cluster.local
    target: ""
    hosts:
      - dex.splitcortex.127.0.0.1.nip.io
