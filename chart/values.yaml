# Ingress controller. Bundled Traefik by default; for an external controller set `traefik.enabled: false`,
# `ingress.className` to its IngressClass, and `rateLimit.enabled: false` unless it is Traefik with its CRDs installed
# (also replace the traefik.ingress.kubernetes.io/* annotations on the Ingresses, e.g. dex.ingress.annotations).
ingress:
  className: traefik

traefik:
  fullnameOverride: traefik   # no release prefix on names (Service `traefik`, used by the dev CoreDNS rewrite)
  enabled: true
  ingressClass:
    # Fixed name so Ingresses and the ACME HTTP-01 solver do not depend on the release name.
    # Keep equal to ingress.className.
    name: traefik
  ports:
    web:
      http:
        redirections:
          # Redirect all HTTP (80) to HTTPS (443) for every Ingress. cert-manager HTTP-01 still works
          # (Let's Encrypt follows redirects). Permanent (301) in all environments.
          entryPoint:
            to: websecure
            scheme: https
            permanent: true

# The one ClusterIssuer `letsencrypt` (templates/cluster-issuers.yaml): Let's Encrypt production, DNS-01 through Cloudflare,
# in every environment, no ACME account email. `cloudflareApiToken` (Cloudflare API token, Zone:DNS:Edit on the zone of
# `global.domain`) is required: locally put it in the git-ignored `values-local.yaml`; stg/prd carry the placeholder
# `${CLOUDFLARE_TOKEN}` that CI substitutes from a GitHub secret. The token is rendered into the Secret
# `cloudflare-api-token`. For an external cert-manager set `cert-manager.enabled: false` (its CRDs/webhook must already
# exist; the issuer name `letsencrypt` must not clash). To use the external cert-manager's own issuers instead, also set
# `clusterIssuers.enabled: false` and point `dex.ingress.annotations."cert-manager.io/cluster-issuer"` (and its TLS) at them.
cloudflareApiToken: ""
clusterIssuers:
  enabled: true

cert-manager:
  enabled: true
  # Resource and pod names are `cert-manager`, `cert-manager-webhook`, ... without the release prefix.
  fullnameOverride: cert-manager
  # Install and keep the CRDs with the release (cert-manager is unusable without them).
  crds:
    enabled: true
  # DNS-01 self-check straight at public resolvers: through the cluster DNS (and the node's/router's resolver) the first
  # "no TXT yet" answer is cached and challenges stay pending for many minutes (also rebinding protection on routers
  # eats the 127.0.0.1 answers of the local domain).
  extraArgs:
    - --dns01-recursive-nameservers-only
    - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53

postgres:
  enabled: true
  # Service is reachable as `postgres` (also used in the DATABASE_URL of the credentials Secret).
  fullnameOverride: postgres
  # Credentials come from the random `postgres-credentials` Secret (templates/postgres-credentials.yaml).
  settings:
    existingSecret: postgres-credentials
    superuser:
      secretKey: superuser
    superuserPassword:
      secretKey: superuser-password
  userDatabase:
    existingSecret: postgres-credentials
    name:
      secretKey: database
    user:
      secretKey: username
    password:
      secretKey: password
  storage:
    requestedSize: 1Gi

# Base domain of every public host: <domain> (the web app), dex.<domain>, web-node.<domain>, gateway.<domain>. Host and URL values
# below (and in values-stg/prd) are rendered with `tpl`, so `{{ .Values.global.domain }}` follows this one setting.
global:
  domain: local.splitcortex.com

dex:
  enabled: true
  # The config Secret is rendered by templates/dex-config.yaml (so `{{ .Values.global.domain }}` works in `config`).
  configSecret:
    create: false
    name: dex-config
  fullnameOverride: dex   # Service `dex` (in-cluster JWKS URL of the control plane)
  image:
    tag: latest
    pullPolicy: IfNotPresent   # `latest` is a moving tag; re-pull on every pod start
  ingress:
    enabled: true
    className: traefik   # IngressClass created by the Traefik subchart (traefik.ingressClass.name)
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      # <release namespace>-rate-limit-general@kubernetescrd (namespace `splitcortex`)
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    hosts:
      - host: "dex.{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dex-tls
        hosts:
          - "dex.{{ .Values.global.domain }}"
  # Custom login theme (templates/dex-theme.yaml, files in chart/files/dex-theme) mounted next to Dex's built-in themes.
  volumes:
    - name: theme
      configMap:
        name: dex-theme
  volumeMounts:
    - name: theme
      mountPath: /srv/dex/web/themes/splitcortex
    # header.html = Dex's own plus one script tag (theme.js follows the web app's light/dark choice).
    - name: theme
      mountPath: /srv/dex/web/templates/header.html
      subPath: header.html
  config:
    # Public URL of Dex (must match what clients/browsers reach); override per environment.
    issuer: "https://dex.{{ .Values.global.domain }}"
    frontend:
      # Without `dir` Dex serves its embedded assets and ignores the mounted theme.
      dir: /srv/dex/web
      issuer: SplitCortex
      logoURL: theme/logo.svg
      theme: splitcortex
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
      # CORS is wide open (Dex cannot turn it off; an empty list blocks browsers): the SPA and Swagger UI call
      # Dex's discovery/token endpoints from the browser. Dex uses no cookies on these endpoints.
      allowedOrigins:
        - "*"
      # Dex rejects (403) preflights asking for any header not listed here (no wildcard support).
      allowedHeaders:
        - Accept
        - Accept-Language
        - Authorization
        - Cache-Control
        - Content-Language
        - Content-Type
        - If-Match
        - If-None-Match
        - Origin
        - Pragma
        - X-Requested-With
        - X-CSRF-Token
    staticClients:
      # Web app (SPA, authorization code + PKCE, no client secret). The UI derives the Dex URL from its own
      # host (`<domain>` -> `dex.<domain>`), so keep hostnames in sync. Lists are replaced, not merged, per environment.
      - id: splitcortex-ui
        name: SplitCortex Web
        public: true
        redirectURIs:
          - "https://{{ .Values.global.domain }}/"
          - "http://{{ .Values.global.domain }}:5173/"
          - "https://{{ .Values.global.domain }}/api/docs/static/oauth2-redirect.html"
    enablePasswordDB: true
    oauth2:
      # No "Grant access" screen: our own first-party clients are trusted.
      skipApprovalScreen: true
    expiry:
      # Access tokens are ID-token lifetime in Dex.
      idTokens: 15m
      refreshTokens:
        # Refresh tokens rotate; two renewals racing (two tabs, a reload) would otherwise make the second fail with
        # "refresh token claimed twice" and sign the user out. A just-rotated token stays usable for this long.
        reuseInterval: 30s
        validIfNotUsedFor: 2160h   # ~3 months
        absoluteLifetime: 2160h    # ~3 months

# Users for the end-to-end suite (src/e2e): extra Dex password users, `{email, hash}` with a bcrypt hash. Empty everywhere
# except stg, where deploy.yaml fills it from the E2E_EMAILS/E2E_PASSWORDS environment secrets (never commit hashes).
# Local dev uses dex.config.staticPasswords in the git-ignored values-local.yaml instead.
e2e:
  users: []

# Web app (src/ui): static SPA served by Caddy on port 8080. TLS and rate limiting are done by the ingress.
ui:
  enabled: true
  replicaCount: 1
  image:
    repository: splitcortex/ui   # Tilt rebuilds and substitutes this image locally
    tag: ""                      # default: chart appVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
  readOnlyRootFilesystem: true   # Tilt dev sets false (Vite writes caches, live_update syncs files)
  ingress:
    enabled: true
    className: traefik   # keep equal to ingress.className
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    # The UI derives the Dex URL from this host (`<domain>` -> `dex.<domain>`) and must be listed in Dex's staticClients.
    hosts:
      - host: "{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - "{{ .Values.global.domain }}"

# Web node (src/web-node): static SPA served by Caddy on port 8080, a browser that serves inference like a phone node. It
# is its own host (`web-node.<domain>`) and ALSO routes `/api` to the control plane (see controlPlane.ingress), so the
# browser talks to the control plane on its own origin: no CORS. TLS and rate limiting are done by the ingress.
webNode:
  enabled: true
  replicaCount: 1
  image:
    repository: splitcortex/web-node   # Tilt rebuilds and substitutes this image locally
    tag: ""                            # default: chart appVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
  readOnlyRootFilesystem: true   # Tilt dev sets false (Vite writes caches, live_update syncs files)
  ingress:
    enabled: true
    className: traefik   # keep equal to ingress.className
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    # The web app derives this host from its own (`<domain>` -> `web-node.<domain>`, ui/src/lib/webNode.ts).
    hosts:
      - host: "web-node.{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: web-node-tls
        hosts:
          - "web-node.{{ .Values.global.domain }}"

# Garage: single-node S3-compatible object storage for model files (subchart `garage` 2.5.0 from https://charts.derwitt.dev, a thin
# wrapper around upstream Garage; `dxflrs/garage` is multi-arch, the chart default is amd64-only). It is internal only: no ingress,
# the control plane streams uploads and Hugging Face mirrors into it. The subchart does not bootstrap anything, so a Helm hook
# Job (templates/garage-bootstrap-job.yaml, control plane image) applies the layout and creates the key and bucket through the admin API. Credentials
# are random and live in the `garage-credentials` Secret (templates/garage-credentials.yaml).
garage:
  enabled: true
  fullnameOverride: garage     # Service name the control plane uses (S3_ENDPOINT http://garage:3900)
  bucket: models               # created by the control plane (S3_BUCKET)
  bootstrap:
    command: [node, dist/storage/bootstrap-cli.js]   # run with the control plane image (Tilt overrides it to use tsx)
  capacityGiB: 20              # declared layout capacity; keep <= persistence.data.size
  image:
    repository: dxflrs/garage
  deployment:
    replicaCount: 1
  garage:
    replicationFactor: "1"
    # SQLite, not LMDB: LMDB needs a huge virtual address space (default map 1 TiB), which a 32-bit OS or a 39-bit-VA arm64
    # kernel (Raspberry Pi) does not give. The engine cannot be switched on an existing meta volume: delete the meta PVC.
    dbEngine: sqlite
    rpc:
      secret:
        create: false
        name: garage-credentials   # key rpcSecret
    admin:
      token:
        create: true
        secret:
          create: false
          name: garage-credentials # key token
  service:
    admin:
      enabled: true            # ClusterIP only (garage-admin:3903), used by the control plane bootstrap
  persistence:
    meta:
      size: 1Gi
    data:
      size: 20Gi

# Control plane (src/control-plane): Fastify REST API under /api (Swagger UI at /api/docs), Drizzle migrations
# run by a Helm hook Job. The OIDC issuer comes from dex.config.issuer; DATABASE_URL from the postgres Secret.
controlPlane:
  enabled: true
  replicaCount: 1
  logLevel: info
  # Proxy hops whose X-Forwarded-For the app trusts for the client IP (enrollment and general limits): Traefik = 1.
  trustedProxyHops: 1
  image:
    repository: splitcortex/control-plane   # Tilt rebuilds and substitutes this image locally
    tag: ""                                 # default: chart appVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
  readOnlyRootFilesystem: true   # Tilt dev sets false (tsx watch)
  database:
    existingSecret: postgres-credentials   # generated by templates/postgres-credentials.yaml
    key: DATABASE_URL
  oidc:
    audience: splitcortex-ui   # the Dex client id of the web app (`aud` of its tokens)
    jwksUrl: ""                # default: http://dex:5556/keys (in-cluster, no public TLS needed)
  gateway:
    # The wss URL nodes connect to. The public key is not configured: the control plane reads it from the Secret
    # `gateway.identity.publicSecret` (`publicKey` here only applies when the gateway is disabled).
    publicKey: ""
    url: "wss://gateway.{{ .Values.global.domain }}/node"
  migrate:
    enabled: true
    command: [node, dist/db/migrate.js]
  # CronJob aborting abandoned multipart uploads (uploads older than maxAgeHours that never completed, and open
  # multipart uploads no model owns). Needs garage.enabled.
  sweep:
    enabled: true
    schedule: "17 3 * * *"   # daily
    maxAgeHours: 24
    command: [node, dist/storage/sweep-cli.js]   # Tilt overrides it to use tsx
  # CronJob deleting audit log rows older than retentionDays (src/db/audit-prune.ts).
  auditPrune:
    enabled: true
    schedule: "43 3 * * *"   # daily
    retentionDays: 90
    command: [node, dist/db/audit-prune-cli.js]   # Tilt overrides it to use tsx
  # CronJob deleting per-organisation metrics rows (pool_metrics, node_metrics) older than retentionDays
  # (src/db/metrics-prune.ts).
  metricsPrune:
    enabled: true
    schedule: "53 * * * *"   # hourly
    retentionDays: 7
    command: [node, dist/db/metrics-prune-cli.js]   # Tilt overrides it to use tsx
  ingress:
    enabled: true
    className: traefik   # keep equal to ingress.className
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-general@kubernetescrd
    # Same host as the web app (same origin, no CORS), and the same on the web node's host (its browser enrolls and
    # downloads models through `/api` there). The TLS Secrets are issued via the UI's and the web node's Ingresses.
    hosts:
      - host: "{{ .Values.global.domain }}"
        paths:
          - path: /api
            pathType: Prefix
      - host: "web-node.{{ .Values.global.domain }}"
        paths:
          - path: /api
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - "{{ .Values.global.domain }}"
      - secretName: web-node-tls
        hosts:
          - "web-node.{{ .Values.global.domain }}"

# Gateway (src/gateway, Rust): the OpenAI-format edge (`/v1/*`) and the node WebSocket (`/node`). Any number of
# replicas: each holds the sockets of the nodes connected to it and forwards a request to the instance that holds a
# suitable node (internal port, no extra software). Reads config from Postgres (LISTEN/NOTIFY, so it needs a direct
# connection) and writes usage_records / node_status / gateway_instances.
gateway:
  enabled: true
  replicas: 1
  internalPort: 8081   # gateway to gateway; in no Service or Ingress
  # Gateway identity key rotation (docs/gateway.md): "" (none), "prepare" (create the next key; the gateways announce
  # it to devices), "promote" (the next key becomes the current one), then back to "" to finish. Each change restarts the
  # gateways and the control plane.
  rotation:
    stage: 
  logLevel: info
  image:
    repository: splitcortex/gateway   # Tilt rebuilds and substitutes this image locally
    tag: ""                           # default: chart appVersion
    pullPolicy: IfNotPresent
  service:
    port: 80
  readOnlyRootFilesystem: true   # Tilt dev sets false (cargo writes build output)
  # Graceful shutdown: on SIGTERM the instance fails readiness, keeps serving for delaySeconds (the load balancer drops it),
  # then refuses new work and waits for running requests, at most timeoutSeconds (set it above your longest request).
  # Most image/audio data (decoded, MiB) one chat request may carry. The gateway holds a request about three times
  # over in memory, so size the pod for this times the concurrent large requests.
  maxMediaMb: 256
  drain:
    delaySeconds: 5
    timeoutSeconds: 3600
  # Fail closed (503) when this many usage buckets are unflushed, or the oldest is older than this many seconds.
  usage:
    maxBuckets: 20000
    maxAgeSeconds: 600
  # The identity key pair is created once by a Helm hook Job (templates/gateway-identity-job.yaml) and stored in two
  # Secrets: the private key for the gateway only, the public key for the control plane (handed to devices at enrollment).
  identity:
    privateSecret: gateway-identity    # key `private-key` (Ed25519 seed, base64)
    publicSecret: gateway-public-key   # key `public-key`
    nextPrivateSecret: gateway-identity-next      # only during a rotation
    nextPublicSecret: gateway-public-key-next     # only during a rotation
    previousPrivateSecret: gateway-identity-previous   # the retired key, kept after a promotion in case of a rollback
    previousPublicSecret: gateway-public-key-previous
    command: [gateway]                 # Tilt overrides it (the dev image has no installed binary)
    kubectlImage: alpine/k8s:1.31.4    # creates the Secrets; any image with a shell and kubectl
  ingress:
    enabled: true
    className: traefik   # keep equal to ingress.className
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-gateway@kubernetescrd
    hosts:
      - host: "gateway.{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gateway-tls
        hosts:
          - "gateway.{{ .Values.global.domain }}"
  # `/node` (device WebSocket) on the gateway host(s) with its own per-IP rate limit (templates/gateway-node-ingress.yaml;
  # hosts/TLS from `ingress` above). Needs `rateLimit.enabled`; set `enabled: false` otherwise.
  nodeIngress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-node@kubernetescrd
  # `/v1` on the web app's host (same origin as the UI, so the Playground needs no CORS on the gateway). Only the
  # `/v1` path: the node WebSocket stays on the gateway host. The TLS Secret is issued via the UI's Ingress.
  appIngress:
    enabled: true
    className: traefik   # keep equal to ingress.className
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: splitcortex-rate-limit-gateway@kubernetescrd
    hosts:
      - host: "{{ .Values.global.domain }}"
        paths:
          - path: /v1
            pathType: Prefix
    tls:
      - secretName: ui-tls
        hosts:
          - "{{ .Values.global.domain }}"

# Traefik rate limits (templates/rate-limits.yaml). Not attached to an entryPoint: reference them from each route.
rateLimit:
  # Requires Traefik's CRDs (bundled or external). Disable for a non-Traefik ingress controller.
  enabled: true
  # Number of trusted proxy hops in X-Forwarded-For (0 = use the direct peer address).
  ipDepth: 0
  # Web app, control plane, Dex: per client IP.
  general:
    average: 50     # requests per period, sustained
    period: 1s
    burst: 100
  # Gateway: a coarse per-API-key flood ceiling only; keep it far above real traffic.
  gateway:
    average: 2000
    period: 1s
    burst: 4000
  # Node WebSocket (`/node`): connection attempts per client IP. Devices behind one NAT share a bucket, and a gateway
  # restart makes them all reconnect at once, so keep it generous (a 429 only delays a node by its backoff).
  node:
    average: 100
    period: 1s
    burst: 500

# Dev-only helpers. Keep disabled in stg/prd (set in values-stg.yaml / values-prd.yaml).
dev:
  coredns:
    # k3s: add a `coredns-custom` ConfigMap in kube-system so these hostnames resolve to Traefik inside pods too.
    # Replaces any existing `coredns-custom` ConfigMap; k3s CoreDNS may need a restart to pick it up
    # (`kubectl -n kube-system rollout restart deploy coredns`).
    enabled: true
    # Service the hosts are rewritten to. Default: traefik.<namespace>.svc.cluster.local
    target: ""
    hosts:
      - "dex.{{ .Values.global.domain }}"
