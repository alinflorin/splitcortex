{{- if and .Values.controlPlane.enabled .Values.controlPlane.ingress.enabled }}
{{- /*
  Same host as the web app, path /api (Traefik prefers the longer prefix over the UI's `/`; the prefix is not
  stripped, the app serves everything under /api, including Swagger UI at /api/docs). Same origin as the SPA, so no CORS.
  No cert-manager annotation here on purpose: the TLS Secret is issued through the UI's Ingress for the same host.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splitcortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  {{- with .Values.controlPlane.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.controlPlane.ingress.className }}
  {{- with .Values.controlPlane.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.controlPlane.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: control-plane
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
