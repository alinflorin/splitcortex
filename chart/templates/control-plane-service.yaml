{{- if .Values.controlPlane.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splitcortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  selector:
    {{- include "splitcortex.selectorLabels" (dict "ctx" . "component" "control-plane") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.controlPlane.service.port }}
      targetPort: http
{{- end }}
