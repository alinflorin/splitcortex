{{- if .Values.clusterIssuers.enabled }}
{{- /*
The one ClusterIssuer is a Helm post-install/post-upgrade hook: its CRDs and the cert-manager webhook
come from the same release, so it must be applied after those are up (use `helm --wait`).
Hooks are not removed on `helm uninstall`.
The weight (10) is deliberate: cert-manager's own post-install hook Job `startupapicheck` (weight 1) waits until
the webhook really answers (its CA bundle is injected by the cainjector some time after the webhook pod is ready;
applying an issuer before that fails with "x509: certificate signed by unknown authority"), so ours must run after it.
Every environment (local, stg, prd) uses this `letsencrypt` issuer with DNS-01 through Cloudflare, so nothing has to be
reachable from the internet and the local domain can point at 127.0.0.1 in public DNS (publicly trusted certificates,
no CA to install). The Cloudflare API token (Zone:DNS:Edit) is a plain Secret in the release namespace (which is where
cert-manager looks for ClusterIssuer secrets), rendered from `cloudflareApiToken`.
*/ -}}
{{- $hook := dict "helm.sh/hook" "post-install,post-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" }}
{{- $token := required "cloudflareApiToken is required" .Values.cloudflareApiToken }}
{{- if contains "${" $token }}{{ fail "cloudflareApiToken still contains an unsubstituted placeholder; run envsubst on the values file first" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: {{ .Release.Namespace }}
  labels: {{- include "splitcortex.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ $token | quote }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  labels: {{- include "splitcortex.labels" . | nindent 4 }}
  annotations: {{- merge (dict "helm.sh/hook-weight" "10") $hook | toYaml | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
{{- end }}
