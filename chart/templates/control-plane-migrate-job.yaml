{{- if and .Values.controlPlane.enabled .Values.controlPlane.migrate.enabled }}
{{- /*
  Database migrations (drizzle). First install: a plain Job (not a hook), created together with Postgres and the
  workloads; a post-install hook would deadlock, because hooks only run once everything is ready and the gateway and
  control plane cannot become ready before the schema exists. They crash-loop until the Job finishes, and --wait
  waits for the Job too. Upgrade: a pre-upgrade hook, so the schema is updated before the new version rolls out
  (the Job from the install is dropped from the release then). The script retries while Postgres is unreachable.
  Hook Jobs are deleted when they succeed; a failed one is kept for inspection until the next run.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: control-plane-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splitcortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane-migrate
  {{- if not .Release.IsInstall }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "splitcortex.selectorLabels" (dict "ctx" . "component" "control-plane-migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "splitcortex.image" (dict "root" . "image" .Values.controlPlane.image) | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          command:
            {{- toYaml .Values.controlPlane.migrate.command | nindent 12 }}
          env:
            {{- include "splitcortex.databaseEnv" . | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.controlPlane.readOnlyRootFilesystem }}
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
