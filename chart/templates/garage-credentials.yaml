{{- /*
Random Garage secrets, generated once and reused on upgrades (looked up from the live Secret): the RPC secret (`rpcSecret`)
and admin token (`token`) the Garage subchart reads, and the S3 key the control plane imports and uses for the models bucket. Kept on uninstall like the
Postgres credentials, because the data volume survives it. The S3 key id/secret use Garage's own formats
(`GK` + 24 hex, 64 hex).
*/ -}}
{{- if .Values.garage.enabled }}
{{- $name := "garage-credentials" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $rpcSecret := (get $existing "rpcSecret" | b64dec) | default (randAlphaNum 32 | sha256sum) }}
{{- $adminToken := (get $existing "token" | b64dec) | default (randAlphaNum 40) }}
{{- $keyId := (get $existing "access-key" | b64dec) | default (printf "GK%s" (randAlphaNum 32 | sha256sum | trunc 24)) }}
{{- $keySecret := (get $existing "secret-key" | b64dec) | default (randAlphaNum 32 | sha256sum) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "splitcortex.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  rpcSecret: {{ $rpcSecret | quote }}
  token: {{ $adminToken | quote }}
  access-key: {{ $keyId | quote }}
  secret-key: {{ $keySecret | quote }}
{{- end }}
