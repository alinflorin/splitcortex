{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splitcortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  selector:
    {{- include "splitcortex.selectorLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- end }}
