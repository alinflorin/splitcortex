{{- if .Values.gateway.enabled }}
{{- /*
  Any number of replicas (`gateway.replicas`): each holds the sockets of the nodes that connected to it, a request that
  lands on an instance without a suitable node is forwarded to one that has it, over the internal port (see docs/gateway.md).
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "splitcortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  # Nodes reconnect (and resume their requests) when a pod goes away, so pods can be replaced one at a time.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "splitcortex.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "splitcortex.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 8 }}
      annotations:
        # A key rotation step changes the identity Secrets: restart the pods so they read them (see docs/gateway.md).
        splitcortex.io/gateway-rotation: {{ .Values.gateway.rotation.stage | quote }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: {{ include "splitcortex.image" (dict "root" . "image" .Values.gateway.image) | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          env:
            {{- include "splitcortex.databaseEnv" . | nindent 12 }}
            - name: GATEWAY_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.identity.privateSecret }}
                  key: private-key
            # Optional: only exists while a key rotation is prepared (see docs/gateway.md).
            - name: GATEWAY_NEXT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.identity.nextPrivateSecret }}
                  key: private-key
                  optional: true
            - name: GATEWAY_INSTANCE_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: GATEWAY_INTERNAL_PORT
              value: {{ .Values.gateway.internalPort | quote }}
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ .Values.gateway.logLevel | quote }}
            - name: USAGE_MAX_BUCKETS
              value: {{ .Values.gateway.usage.maxBuckets | quote }}
            - name: USAGE_MAX_AGE_SECONDS
              value: {{ .Values.gateway.usage.maxAgeSeconds | quote }}
          ports:
            - name: http
              containerPort: 8080
            # Gateway to gateway forwarding. Not in the Service or the Ingress; every call needs a token derived from the identity key.
            - name: internal
              containerPort: {{ .Values.gateway.internalPort }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.gateway.readOnlyRootFilesystem }}
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
