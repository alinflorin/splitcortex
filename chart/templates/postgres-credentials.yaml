{{- /*
Random Postgres credentials, generated once and reused on upgrades (looked up from the live Secret).
Referenced by name from the `postgres` subchart values. The Secret is kept on uninstall because the
Postgres PVC is retained too, and a new random password would no longer match the data on disk.
*/ -}}
{{- if .Values.postgres.enabled }}
{{- $name := "postgres-credentials" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $superuserPassword := (get $existing "superuser-password" | b64dec) | default (randAlphaNum 32) }}
{{- $password := (get $existing "password" | b64dec) | default (randAlphaNum 32) }}
{{- $database := "splitcortex" }}
{{- $username := "splitcortex" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "splitcortex.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  superuser: postgres
  superuser-password: {{ $superuserPassword | quote }}
  database: {{ $database | quote }}
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  # Passwords are alphanumeric, so they are safe to embed in a URL unescaped.
  DATABASE_URL: {{ printf "postgres://%s:%s@postgres:5432/%s?sslmode=disable" $username $password $database | quote }}
{{- end }}
