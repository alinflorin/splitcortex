# Deploy a released chart version (chart and images tagged X.Y.Z) to an environment.
# Called by release.yaml for stg, or run manually (also to redeploy or roll back).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [stg, prd]
        default: stg
      version:
        description: Release version, with or without the leading v (e.g. 1.2.3)
        type: string
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Environment secrets: KUBECONFIG (base64 or plain), CLOUDFLARE_TOKEN (Zone:DNS:Edit),
    # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (stg Dex Google login), E2E_EMAILS, E2E_PASSWORDS (stg only; users of the e2e suite).
    # Add required reviewers on the environment for a manual approval gate.
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      E2E_EMAILS: ${{ secrets.E2E_EMAILS }}
      E2E_PASSWORDS: ${{ secrets.E2E_PASSWORDS }}
    steps:
      - name: Normalise version
        run: |
          V="${{ inputs.version }}"
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"

      # Check out the tag so values-<env>.yaml matches the released chart.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ env.VERSION }}

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: latest

      - name: Configure cluster access
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          if echo "$KUBECONFIG_DATA" | base64 -d > "$RUNNER_TEMP/kubeconfig" 2>/dev/null && grep -q apiVersion "$RUNNER_TEMP/kubeconfig"; then :; else
            printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          fi
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Substitute deploy-time placeholders
        run: |
          f="chart/values-${ENVIRONMENT}.yaml"
          envsubst '$CLOUDFLARE_TOKEN $GOOGLE_CLIENT_ID $GOOGLE_CLIENT_SECRET' < "$f" > "$RUNNER_TEMP/values.yaml"

      # stg only: the end-to-end suite's users (comma separated secrets, same order) as bcrypt hashes for Dex.
      - name: Make E2E user hashes
        if: inputs.environment == 'stg' && env.E2E_EMAILS != ''
        run: |
          IFS=',' read -ra EMAILS <<< "$E2E_EMAILS"
          IFS=',' read -ra PASSWORDS <<< "$E2E_PASSWORDS"
          [ "${#EMAILS[@]}" -eq "${#PASSWORDS[@]}" ] || { echo "::error::E2E_EMAILS and E2E_PASSWORDS differ in length"; exit 1; }
          echo "e2e:" > "$RUNNER_TEMP/e2e-users.yaml"
          echo "  users:" >> "$RUNNER_TEMP/e2e-users.yaml"
          for i in "${!EMAILS[@]}"; do
            HASH="$(htpasswd -bnBC 10 "" "${PASSWORDS[$i]}" | tr -d ':\n' | sed 's/^\$2y/$2a/')"
            printf "    - email: '%s'\n      hash: '%s'\n" "$(echo "${EMAILS[$i]}" | xargs)" "$HASH" >> "$RUNNER_TEMP/e2e-users.yaml"
          done

      - name: Helm upgrade
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          # --wait is required: the ClusterIssuer hooks run after the cert-manager webhook is ready.
          EXTRA=()
          [ -f "$RUNNER_TEMP/e2e-users.yaml" ] && EXTRA=(-f "$RUNNER_TEMP/e2e-users.yaml")
          helm upgrade -i --wait --atomic --timeout 10m \
            --create-namespace -n splitcortex \
            -f "$RUNNER_TEMP/values.yaml" "${EXTRA[@]}" \
            --version "$VERSION" \
            splitcortex "oci://ghcr.io/${OWNER}/charts/splitcortex"
