# Deploy a released chart version (chart and images tagged X.Y.Z) to an environment.
# Called by release.yaml for stg, or run manually (also to redeploy or roll back).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [stg, prd]
        default: stg
      version:
        description: Release version, with or without the leading v (e.g. 1.2.3)
        type: string
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Environment secrets: KUBECONFIG (base64 or plain), LETSENCRYPT_EMAIL,
    # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (stg Dex Google login). Repository secrets E2E_EMAIL, E2E_PASSWORD (stg
    # only: the Dex user the e2e workflow signs in with; the password is bcrypt-hashed here, Dex only stores the hash).
    # Add required reviewers on the environment for a manual approval gate.
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Normalise version
        run: |
          V="${{ inputs.version }}"
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"

      # Check out the tag so values-<env>.yaml matches the released chart.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ env.VERSION }}

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: latest

      - name: Configure cluster access
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          if echo "$KUBECONFIG_DATA" | base64 -d > "$RUNNER_TEMP/kubeconfig" 2>/dev/null && grep -q apiVersion "$RUNNER_TEMP/kubeconfig"; then :; else
            printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          fi
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Dex wants a bcrypt hash, the e2e workflow needs the plain password: GitHub holds the password, the hash is made
      # here on every deploy (the salt changes, the password does not).
      - name: Install htpasswd
        if: inputs.environment == 'stg'
        run: sudo apt-get update && sudo apt-get install -y apache2-utils
      - name: Hash the e2e user's password
        if: inputs.environment == 'stg'
        run: |
          [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ] || { echo "::error::Set the environment secrets E2E_EMAIL and E2E_PASSWORD"; exit 1; }
          hash="$(printf '%s' "$E2E_PASSWORD" | htpasswd -inBC 10 '' | tr -d ':\n' | sed 's/^\$2y/$2a/')"
          echo "::add-mask::$hash"
          echo "E2E_PASSWORD_HASH=$hash" >> "$GITHUB_ENV"

      - name: Substitute deploy-time placeholders
        run: |
          f="chart/values-${ENVIRONMENT}.yaml"
          envsubst '$LETSENCRYPT_EMAIL $GOOGLE_CLIENT_ID $GOOGLE_CLIENT_SECRET $E2E_EMAIL $E2E_PASSWORD_HASH' < "$f" > "$RUNNER_TEMP/values.yaml"

      - name: Helm upgrade
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          # --wait is required: the ClusterIssuer hooks run after the cert-manager webhook is ready.
          helm upgrade -i --wait --atomic --timeout 10m \
            --create-namespace -n splitcortex \
            -f "$RUNNER_TEMP/values.yaml" \
            --version "$VERSION" \
            splitcortex "oci://ghcr.io/${OWNER}/charts/splitcortex"
