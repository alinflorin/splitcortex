# Mobile app release, tag node-vX.Y.Z (independent of the server vX.Y.Z tags): verify, build the
# signed release APK and attach it to a GitHub release named after the tag.
name: Node release

on:
  push:
    tags: ["node-v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  node:
    uses: ./.github/workflows/node.yaml
    secrets: inherit

  github-release:
    needs: node
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: splitcortex-node-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Not "latest": that badge belongs to the server release.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --latest=false
          gh release upload "$TAG" splitcortex-node-*.apk --clobber
