# End-to-end tests (e2e/): the web app and web node in a browser, the CLI node binary, the desktop app (tauri-driver) and
# the Android app (emulator + Maestro), all against a deployed stack, in parallel. Staging by default; a manual run can
# point at another stack. The node suites test the newest *released* builds (override the version per run).
# Needs the repository secrets E2E_EMAIL and E2E_PASSWORD (deploy.yaml reads the same ones to provision that Dex user
# on stg).
name: E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      app_url:
        description: Web app origin to test (Dex and web node are derived from it unless overridden below)
        type: string
        default: https://app.stg.splitcortex.alinflorinciu.qoffice.ro
      dex_url:
        description: Dex origin, if it is not the app host with app. -> dex.
        type: string
      web_node_url:
        description: Web node origin, if it is not the app host with app. -> web-node.
        type: string
      cli_version:
        description: cli-node version to test, X.Y.Z (default newest release)
        type: string
      desktop_version:
        description: desktop-node version to test, X.Y.Z (default newest release)
        type: string
      mobile_version:
        description: mobile-node version to test, X.Y.Z (default newest release)
        type: string
      suites:
        description: Which suites to run
        type: choice
        options: [all, platform, web-node, cli, desktop, mobile]
        default: all

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

env:
  E2E_APP_URL: ${{ inputs.app_url || 'https://app.stg.splitcortex.alinflorinciu.qoffice.ro' }}
  E2E_DEX_URL: ${{ inputs.dex_url }}
  E2E_WEB_NODE_URL: ${{ inputs.web_node_url }}
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

defaults:
  run:
    working-directory: e2e

jobs:
  platform:
    if: inputs.suites == '' || inputs.suites == 'all' || inputs.suites == 'platform'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The browser download is cached per Playwright version (the lockfile); the system libraries come from apt each time.
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:platform
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-platform-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  web-node:
    if: inputs.suites == '' || inputs.suites == 'all' || inputs.suites == 'web-node'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The browser download is cached per Playwright version (the lockfile); the system libraries come from apt each time.
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:web-node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-web-node-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  cli:
    if: inputs.suites == '' || inputs.suites == 'all' || inputs.suites == 'cli'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Installs the released binary the way a user does (this also exercises install.sh).
      - name: Install the CLI node
        working-directory: .
        env:
          SPLITCORTEX_VERSION: ${{ inputs.cli_version }}
          SPLITCORTEX_INSTALL_DIR: ${{ runner.temp }}/cli-node
          SPLITCORTEX_BIN_DIR: ${{ runner.temp }}/cli-bin
          SPLITCORTEX_URL: ${{ env.E2E_APP_URL }}
        run: |
          sh src/cli-node/install.sh
          echo "E2E_CLI_BIN=$RUNNER_TEMP/cli-bin/splitcortex-node" >> "$GITHUB_ENV"
      - run: pnpm test:cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-cli-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  desktop:
    if: inputs.suites == '' || inputs.suites == 'all' || inputs.suites == 'desktop'
    # 22.04: the release's .deb is built there (webkit2gtk-4.1).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Install the desktop app (newest release's .deb) and the WebDriver
        working-directory: .
        env:
          VERSION: ${{ inputs.desktop_version }}
        run: |
          if [ -n "$VERSION" ]; then tag="desktop-node-v$VERSION"; else
            tag="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^desktop-node-v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')"
          fi
          echo "Testing $tag"
          gh release download "$tag" --pattern '*_amd64.deb' --dir "$RUNNER_TEMP/desktop"
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP"/desktop/*_amd64.deb webkit2gtk-driver xvfb
          echo "E2E_DESKTOP_BIN=/usr/bin/splitcortex-desktop-node" >> "$GITHUB_ENV"
      - name: Cache tauri-driver
        id: driver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-ubuntu-22.04-v1
      - if: steps.driver.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked
      - run: xvfb-run -a pnpm test:desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-desktop-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  mobile:
    if: inputs.suites == '' || inputs.suites == 'all' || inputs.suites == 'mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The emulator image: the AVD cache key is built from these, so changing any of them starts a fresh cache.
    env:
      ANDROID_API: 34
      ANDROID_ARCH: x86_64
      ANDROID_TARGET: google_atd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile

      - name: Download the app (newest release's APK)
        working-directory: .
        env:
          VERSION: ${{ inputs.mobile_version }}
        run: |
          if [ -n "$VERSION" ]; then tag="mobile-node-v$VERSION"; else
            tag="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^mobile-node-v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')"
          fi
          echo "Testing $tag"
          gh release download "$tag" --pattern '*.apk' --dir "$RUNNER_TEMP/apk"
          echo "E2E_MOBILE_APK=$(ls "$RUNNER_TEMP"/apk/*.apk)" >> "$GITHUB_ENV"

      # Maestro has no pinned release here: the newest CLI from its GitHub releases.
      - name: Resolve the Maestro version
        id: maestro
        working-directory: .
        run: echo "tag=$(gh release view --repo mobile-dev-inc/maestro --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - name: Cache Maestro
        id: maestro-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/maestro
          key: maestro-${{ steps.maestro.outputs.tag }}
      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/${{ steps.maestro.outputs.tag }}/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
      - run: echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator's disk and a booted snapshot are cached; the first run (or a new key) creates them.
      # Caches are saved explicitly (restore + save): a plain `actions/cache` only saves when the whole job succeeds, and
      # the first runs may well fail on tests. The SDK lives in a root-owned folder on the runner, so the one folder the
      # cache restores into (the emulator system image) is handed to the runner user first.
      - name: Make the SDK's system-images folder writable
        run: |
          sudo mkdir -p "$ANDROID_HOME/system-images"
          sudo chown -R "$USER" "$ANDROID_HOME/system-images"
      # The emulator download sometimes arrives corrupt ("Error reading Zip content"), which the runner action ignores and
      # then fails with "could not connect to TCP port 5554". Install it here with retries so the action finds it ready.
      - name: Install the Android emulator (with retries)
        run: |
          for attempt in 1 2 3 4; do
            if sdkmanager --install emulator --channel=0 && [ -x "$ANDROID_HOME/emulator/emulator" ]; then
              exit 0
            fi
            echo "Emulator install failed (attempt $attempt), retrying"
            rm -rf "$ANDROID_HOME/emulator"
            sleep 10
          done
          echo "Could not install the Android emulator" >&2
          exit 1
      - name: Restore the emulator system image
        id: image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ env.ANDROID_API }}/${{ env.ANDROID_TARGET }}/${{ env.ANDROID_ARCH }}
          key: sdk-image-${{ env.ANDROID_API }}-${{ env.ANDROID_ARCH }}-${{ env.ANDROID_TARGET }}
      - name: Restore the emulator (AVD)
        id: avd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ANDROID_API }}-${{ env.ANDROID_ARCH }}-${{ env.ANDROID_TARGET }}
      - name: Create the AVD and its snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.ANDROID_API }}
          arch: ${{ env.ANDROID_ARCH }}
          target: ${{ env.ANDROID_TARGET }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: echo "Generated the AVD snapshot for caching."
      - name: Save the emulator (AVD)
        if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ANDROID_API }}-${{ env.ANDROID_ARCH }}-${{ env.ANDROID_TARGET }}
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.ANDROID_API }}
          arch: ${{ env.ANDROID_ARCH }}
          target: ${{ env.ANDROID_TARGET }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: e2e
          script: pnpm test:mobile
      - name: Save the emulator system image
        if: always() && steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ env.ANDROID_API }}/${{ env.ANDROID_TARGET }}/${{ env.ANDROID_ARCH }}
          key: sdk-image-${{ env.ANDROID_API }}-${{ env.ANDROID_ARCH }}-${{ env.ANDROID_TARGET }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-mobile-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
