# Creates the release tags and pushes them one by one (GitHub fires no tag workflows when more than 3
# tags arrive in one push). Each tag starts its own release workflow:
#   vX.Y.Z               release.yaml (chart, images, GitHub release, stg deploy; includes the web app and web node)
#   mobile-node-vX.Y.Z   mobile-node-release.yaml
#   desktop-node-vX.Y.Z  desktop-node-release.yaml
#   cli-node-vX.Y.Z      cli-node-release.yaml
#
# Two ways in:
#   1. Push to main that changes VERSIONS.txt (repository root): every tag listed there that does not
#      exist yet is created on the pushed commit; existing ones are skipped.
#   2. Run manually (Actions > Create release tags): give a version and tick the tags. Without a
#      version it does the same as the push, from VERSIONS.txt on the chosen branch.
#
# Needs the repository secret GH_TOKEN: a personal access token (fine-grained: Contents read/write on
# this repository). Tags pushed with the built-in GITHUB_TOKEN do not start other workflows, so the
# release workflows would never run.
name: Create release tags

on:
  push:
    branches: [main]
    paths: [VERSIONS.txt]
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (no leading v), for example 5.0.1. Empty: use VERSIONS.txt"
        required: false
        type: string
      platform:
        description: "Platform: vX.Y.Z (control plane, gateway, web app, web node, chart)"
        type: boolean
        default: true
      mobile:
        description: "Mobile node: mobile-node-vX.Y.Z"
        type: boolean
        default: true
      desktop:
        description: "Desktop node: desktop-node-vX.Y.Z"
        type: boolean
        default: true
      cli:
        description: "CLI node: cli-node-vX.Y.Z"
        type: boolean
        default: true

concurrency:
  group: create-tags
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Create the missing tags
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ inputs.platform }}
          MOBILE: ${{ inputs.mobile }}
          DESKTOP: ${{ inputs.desktop }}
          CLI: ${{ inputs.cli }}
          HAS_TOKEN: ${{ secrets.GH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the repository secret GH_TOKEN (see the comment at the top of this workflow)."
            exit 1
          fi

          wanted=()
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must look like 5.0.1 (no leading v)."
              exit 1
            fi
            [ "$PLATFORM" = "true" ] && wanted+=("v$VERSION")
            [ "$MOBILE" = "true" ] && wanted+=("mobile-node-v$VERSION")
            [ "$DESKTOP" = "true" ] && wanted+=("desktop-node-v$VERSION")
            [ "$CLI" = "true" ] && wanted+=("cli-node-v$VERSION")
          else
            # One tag per line; blank lines and # comments are ignored.
            while IFS= read -r line; do
              line="${line%%#*}"
              line="$(echo "$line" | tr -d '[:space:]')"
              [ -n "$line" ] && wanted+=("$line")
            done < VERSIONS.txt
          fi

          for tag in "${wanted[@]}"; do
            if ! [[ "$tag" =~ ^(mobile-node-|desktop-node-|cli-node-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Not a release tag: $tag"
              exit 1
            fi
          done
          if [ "${#wanted[@]}" -eq 0 ]; then
            echo "::error::No tags to create (nothing ticked, or VERSIONS.txt lists none)."
            exit 1
          fi

          git fetch --tags --quiet
          missing=()
          for tag in "${wanted[@]}"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists, skipped"
            else
              missing+=("$tag")
            fi
          done

          sha="$(git rev-parse HEAD)"
          {
            echo "### Release tags on \`${sha:0:7}\`"
            for tag in "${wanted[@]}"; do
              if printf '%s\n' "${missing[@]:-}" | grep -qx "$tag"; then echo "- \`$tag\`: created"; else echo "- \`$tag\`: already existed"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "${missing[@]:-}"; do
            [ -n "$tag" ] || continue
            git tag -a "$tag" -m "$tag"
            git push origin "refs/tags/$tag"
            echo "Pushed $tag"
            sleep 5
          done
