# Server release, tag vX.Y.Z: validate and publish the chart, build all images (chart version,
# appVersion and image tags all equal X.Y.Z), publish the GitHub release, then deploy to stg.
# prd is promoted by hand (deploy.yaml) with the same version, nothing is rebuilt.
# The mobile app has its own tag stream, mobile-node-vX.Y.Z (mobile-node-release.yaml).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Re-run for an existing tag: choose the tag under "Use workflow from".
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Manual runs must start from the tag itself (Run workflow -> "Use workflow from" -> Tags -> vX.Y.Z):
  # versions, image tags and the GitHub release are all derived from the ref.
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from the tag (Use workflow from > Tags), not from a branch."
            exit 1
          fi

  chart:
    needs: check-tag
    uses: ./.github/workflows/chart.yaml

  # One job per service; add new services here and to deploy-stg's needs.
  ui:
    needs: check-tag
    uses: ./.github/workflows/ui.yaml

  web-node:
    needs: check-tag
    uses: ./.github/workflows/web-node.yaml

  control-plane:
    needs: check-tag
    uses: ./.github/workflows/control-plane.yaml

  gateway:
    needs: check-tag
    uses: ./.github/workflows/gateway.yaml

  # GitHub release with generated notes, once everything built.
  github-release:
    needs: [chart, ui, web-node, control-plane, gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --latest

  deploy-stg:
    needs: [chart, ui, web-node, control-plane, gateway]
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: stg
      version: ${{ github.ref_name }}
    secrets: inherit
