# CodeQL runs weekly and on demand only (not on push or pull request).
name: "CodeQL"

on:
  schedule:
    - cron: "40 0 * * 3"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload results
      packages: read # fetch CodeQL packs
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # workflows under .github/workflows
          - language: actions
          # ui, web-node, desktop-node (web side), control-plane, mobile-node
          - language: javascript-typescript
          # gateway, cli-node, desktop-node/src-tauri
          - language: rust
          # scripts/fetch-litert.py
          - language: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"

  # Kotlin (the local Expo module: Android foreground service, telemetry) cannot be analyzed
  # without a build, so this job generates the android/ project (git-ignored) and builds it
  # under the CodeQL tracer. Same toolchain steps as mobile-node.yaml.
  analyze-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    defaults:
      run:
        working-directory: src/mobile-node

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: src/mobile-node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/mobile-node/pnpm-lock.yaml
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - run: pnpm install --frozen-lockfile
      # Generates the native android/ project (git-ignored, never committed).
      - run: pnpm exec expo prebuild --platform android --no-install

      # Same retrying NDK install as mobile-node.yaml (Gradle's own auto-install has no retry).
      - name: Install Android NDK
        env:
          NDK_VERSION: 27.1.12297006
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" \
              && [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
              exit 0
            fi
            echo "::warning::NDK install attempt $attempt failed, retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not install NDK $NDK_VERSION"
          exit 1

      # Initialized after the project exists and the toolchain is installed, right before the build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # --no-daemon and --no-build-cache so every Kotlin file is compiled under the tracer.
      - name: Build
        working-directory: src/mobile-node/android
        run: ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:java-kotlin"
