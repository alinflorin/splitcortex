# Reusable template: build a service image natively per architecture (in parallel),
# push each by digest, then merge into one multi-arch manifest. PRs build only.
# Call it from a per-service workflow, see ui.yaml.
name: Docker service (template)

on:
  workflow_call:
    inputs:
      service:
        description: Service name; image is ghcr.io/<owner>/splitcortex-<service>
        required: true
        type: string
      context:
        description: Docker build context
        required: true
        type: string
      dockerfile:
        description: Dockerfile path (production Dockerfile, not Dockerfile.dev)
        required: true
        type: string
      test-report:
        description: >-
          The Dockerfile has a `test-report` stage (JUnit XML of its unit tests): export it before the build and show
          it on the run (needs `checks: write` from the caller)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      checks: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare
        id: prep
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/splitcortex-${{ inputs.service }}" >> "$GITHUB_OUTPUT"
          PLATFORM="${{ matrix.platform }}"
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
          # The release version (tag without `v`) for images that embed it (web-node); empty off-tag.
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.prep.outputs.image }}

      # The Dockerfile runs its unit tests in a stage that never fails, so the JUnit report is exported (and shown) even
      # when they fail; the build below then fails the image. Once, on amd64; the layers are reused by the build.
      - name: Unit tests (export the JUnit report)
        if: inputs.test-report && matrix.platform == 'linux/amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: test-report
          outputs: type=local,dest=test-report/${{ inputs.service }}
          cache-from: type=gha,scope=${{ inputs.service }}-${{ steps.prep.outputs.pair }}

      - name: Unit tests (report)
        if: ${{ !cancelled() && inputs.test-report && matrix.platform == 'linux/amd64' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.0.0
        with:
          name: Unit tests (${{ inputs.service }})
          path: test-report/${{ inputs.service }}/junit.xml
          reporter: java-junit
          list-suites: all
          list-tests: failed
          # The build below fails on failing tests; this step only reports.
          fail-on-error: false
          fail-on-empty: false

      - name: Unit tests (keep the JUnit file)
        if: ${{ !cancelled() && inputs.test-report && matrix.platform == 'linux/amd64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-${{ inputs.service }}
          path: test-report/${{ inputs.service }}/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.prep.outputs.version }}
          outputs: type=image,name=${{ steps.prep.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ inputs.service }}-${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-${{ steps.prep.outputs.pair }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ inputs.service }}-${{ steps.prep.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        id: prep
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/splitcortex-${{ inputs.service }}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.service }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            # v1.2.3 -> 1.2.3, 1.2 (matches the chart appVersion, which has no "v")
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # main and manual runs from branches
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.prep.outputs.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.prep.outputs.image }}:${{ steps.meta.outputs.version }}"
