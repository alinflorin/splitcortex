# Mobile app release, tag mobile-node-vX.Y.Z (independent of the server vX.Y.Z tags): verify, build the
# signed release APK and attach it to a GitHub release named after the tag.
name: Mobile node release

on:
  push:
    tags: ["mobile-node-v[0-9]+.[0-9]+.[0-9]+"]
  # Re-run for an existing tag: choose the tag under "Use workflow from".
  workflow_dispatch:

concurrency:
  group: mobile-node-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Manual runs must start from the tag itself (Run workflow -> "Use workflow from" -> Tags -> vX.Y.Z):
  # versions, image tags and the GitHub release are all derived from the ref.
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from the tag (Use workflow from > Tags), not from a branch."
            exit 1
          fi

  mobile-node:
    needs: check-tag
    uses: ./.github/workflows/mobile-node.yaml
    secrets: inherit

  github-release:
    needs: mobile-node
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: splitcortex-mobile-node-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Not "latest": that badge belongs to the server release.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "mobile-node ${TAG#mobile-node-v}" --generate-notes --verify-tag --latest=false
          gh release upload "$TAG" splitcortex-mobile-node-*.apk --clobber
