name: Gateway image

on:
  push:
    branches: [main]
    paths: ["src/gateway/**", ".github/workflows/gateway.yaml", ".github/workflows/docker-service.yaml"]
  pull_request:
    paths: ["src/gateway/**", ".github/workflows/gateway.yaml", ".github/workflows/docker-service.yaml"]
  workflow_dispatch:
  # Tags are handled by release.yaml, which calls this workflow.
  workflow_call:

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
      checks: write
    uses: ./.github/workflows/docker-service.yaml
    with:
      service: gateway
      context: src/gateway
      dockerfile: src/gateway/Dockerfile
      test-report: true
