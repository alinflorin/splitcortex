name: Desktop node app

on:
  push:
    branches: [main]
    paths: ["src/desktop-node/**", ".github/workflows/desktop-node.yaml"]
  pull_request:
    paths: ["src/desktop-node/**", ".github/workflows/desktop-node.yaml"]
  workflow_dispatch:

concurrency:
  group: desktop-node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Verification only (no image, no deploy, no bundle): the web side (typecheck, format, tests, build) and the Rust side
# (fmt, clippy, tests, which also load the real LiteRT-LM library and resolve every function the app calls).
# Installers are built by desktop-node-release.yaml on a desktop-node-vX.Y.Z tag.
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src/desktop-node
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/desktop-node/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/desktop-node/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src/desktop-node/src-tauri -> target"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

      - name: Fetch the LiteRT-LM library
        run: pnpm litert:fetch
      - run: cargo fmt --check
        working-directory: src/desktop-node/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src/desktop-node/src-tauri
      - run: cargo test
        working-directory: src/desktop-node/src-tauri
