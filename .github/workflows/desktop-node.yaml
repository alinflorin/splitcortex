name: Desktop node app

on:
  push:
    branches: [main]
    paths: ["src/desktop-node/**", ".github/workflows/desktop-node.yaml"]
  pull_request:
    paths: ["src/desktop-node/**", ".github/workflows/desktop-node.yaml"]
  workflow_dispatch:

concurrency:
  group: desktop-node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Verification only (no image, no deploy, no bundle): the web side (typecheck, format, tests, build) and the Rust side
# (fmt, clippy, tests, which also load the real LiteRT-LM library and resolve every function the app calls).
# Installers are built by desktop-node-release.yaml on a desktop-node-vX.Y.Z tag.
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src/desktop-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cached .debs. execute_install_scripts runs the packages' post-install scripts (ldconfig, symlinks): without it the
      # -dev libraries (gdk, pango, webkit) were not found at link time.
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          execute_install_scripts: true
          version: 2

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: src/desktop-node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/desktop-node/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src/desktop-node/src-tauri -> target"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

      - name: Fetch the LiteRT-LM library
        run: pnpm litert:fetch
      # Lints are platform-independent enough to run once, on Linux x64 (clippy is the slowest step on Windows); tests run everywhere.
      - run: cargo fmt --check
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src/desktop-node/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src/desktop-node/src-tauri
      - run: cargo test
        working-directory: src/desktop-node/src-tauri
