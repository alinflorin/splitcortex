# Desktop app release, tag desktop-node-vX.Y.Z (its own stream, independent of the server vX.Y.Z and the mobile
# mobile-node-vX.Y.Z tags): builds the installers for every platform, signs the update bundles and attaches
# everything to a GitHub release named after the tag. The auto-updater reads latest.json from the rolling release
# `desktop-node-updater` (the repository's "latest" release belongs to the server, so the usual
# releases/latest/download URL cannot be used).
name: Desktop node release

on:
  push:
    tags: ["desktop-node-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z); the tag desktop-node-vX.Y.Z must exist"
        required: true
        type: string

concurrency:
  group: desktop-node-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.version && format('desktop-node-v{0}', inputs.version) || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Not "latest": that badge belongs to the server release.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SplitCortex Node ${TAG#desktop-node-v}" --generate-notes --verify-tag --latest=false
          echo "id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#desktop-node-v}" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            args: ""
          - platform: macos-latest
            triple: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # macOS x86_64 (Intel) is not built: Google publishes no LiteRT-LM library for it (only macos_arm64), so the
          # app would install but could not serve. Add { macos-latest, x86_64-apple-darwin } here once there is one.
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src/desktop-node
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/desktop-node/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/desktop-node/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src/desktop-node/src-tauri -> target"
          key: ${{ matrix.triple }}

      - run: pnpm install --frozen-lockfile
      - name: Set the version from the tag
        run: node scripts/set-version.mjs "${{ needs.create-release.outputs.version }}"
      - name: Fetch the LiteRT-LM library for this target
        run: node scripts/fetch-litert.mjs ${{ matrix.triple }} --required

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_NODE_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_NODE_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_APP_VERSION: ${{ needs.create-release.outputs.version }}
        with:
          projectPath: src/desktop-node
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json is rebuilt from the release assets below (parallel jobs would race on it).
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  updater-json:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 src/desktop-node/scripts/make-latest-json.py "$GH_REPO" "$TAG"
          # The rolling release the app's updater endpoint points at (never "latest", see the top of this file).
          gh release view desktop-node-updater >/dev/null 2>&1 || gh release create desktop-node-updater --title "Desktop node updater feed" --notes "latest.json for the desktop app's auto-updater. Rewritten by every desktop-node release; do not delete." --prerelease --latest=false --target "$GITHUB_SHA"
          gh release upload desktop-node-updater latest.json --clobber
