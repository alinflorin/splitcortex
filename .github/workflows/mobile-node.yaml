name: Mobile node app

on:
  push:
    branches: [main]
    paths: ["src/mobile-node/**", ".github/workflows/mobile-node.yaml"]
  pull_request:
    paths: ["src/mobile-node/**", ".github/workflows/mobile-node.yaml"]
  workflow_dispatch:
  # Tags (mobile-node-vX.Y.Z) are handled by mobile-node-release.yaml, which calls this workflow.
  workflow_call:

concurrency:
  group: mobile-node-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

# The app is built locally on devices (no EAS, no image, no deploy), so this workflow only
# verifies it and produces a debug APK artifact; mobile-node-release.yaml calls it on a mobile-node-vX.Y.Z tag, which builds a signed release APK
# (secrets ANDROID_KEYSTORE_*) and attaches it to the GitHub release.
jobs:
  # Not run on release tags: the commit was already verified by the push to main.
  verify:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: src/mobile-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: src/mobile-node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/mobile-node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      # test:ci also writes reports/junit.xml (jest-junit), shown below as a test report even when a test fails.
      - run: pnpm test:ci
      - name: Unit test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.0.0
        with:
          name: Unit tests (mobile-node)
          path: src/mobile-node/reports/junit.xml
          reporter: java-junit
          list-tests: failed
          fail-on-error: false
          fail-on-empty: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: junit-mobile-node
          path: src/mobile-node/reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      # Bundles the JS for Android: catches import and Metro errors without a device.
      - run: pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/export"

  # Runs in parallel with verify (the workflow still fails if either fails; github-release waits for the whole workflow).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: src/mobile-node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/mobile-node/pnpm-lock.yaml
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - run: pnpm install --frozen-lockfile
      # React Native's CMake build uses ccache automatically when it is installed (reactnative.dev/docs/build-speed),
      # so the native C++ (RN, Hermes glue, our modules) is not recompiled when unchanged.
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.ref_type == 'tag' && 'release' || 'debug' }}-${{ hashFiles('src/mobile-node/pnpm-lock.yaml') }}
          restore-keys: ccache-android-${{ github.ref_type == 'tag' && 'release' || 'debug' }}-
      - run: ccache --set-config=max_size=1G
      # Tags build a signed release APK whose version follows the tag; everything else a debug APK.
      - name: Set version and signing
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret ANDROID_$v is not set (see src/mobile-node/scripts/create-keystore.sh)"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "APP_VERSION=${GITHUB_REF_NAME#mobile-node-v}"
            echo "SC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SC_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SC_KEY_ALIAS=$KEY_ALIAS"
            echo "SC_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      # Generates the native android/ project (git-ignored, never committed).
      - run: pnpm exec expo prebuild --platform android --no-install
      # Gradle's own NDK auto-install has no retry and fails on a truncated download
      # ("Archive is not a ZIP archive"), so install the pinned NDK up front with retries.
      - name: Install Android NDK
        env:
          NDK_VERSION: 27.1.12297006
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" \
              && [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
              exit 0
            fi
            echo "::warning::NDK install attempt $attempt failed, retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not install NDK $NDK_VERSION"
          exit 1
      # LiteRT-LM only ships arm64-v8a and x86_64 (the patched library filters to those), so armeabi-v7a and x86 could never run the engine:
      # releases build just those two; every other run builds x86_64 alone (the CI debug APK is emulator-only).
      - name: Build APK
        working-directory: src/mobile-node/android
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
          else
            ./gradlew assembleDebug --build-cache -PreactNativeArchitectures=x86_64
          fi
      - run: ccache --show-stats
      # Tag builds are named after the version (splitcortex-mobile-node-vX.Y.Z.apk), others after the commit.
      - name: Name the APK
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "splitcortex-mobile-node-v${GITHUB_REF_NAME#mobile-node-v}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "splitcortex-mobile-node-$GITHUB_SHA.apk"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: splitcortex-mobile-node-apk
          path: src/mobile-node/splitcortex-mobile-node-*.apk
          if-no-files-found: error
          retention-days: 14
