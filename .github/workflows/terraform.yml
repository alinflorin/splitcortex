name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to run
        type: choice
        options: [stg, prd]
        default: stg
      apply:
        description: Apply after plan (only honoured on main)
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time per ref, so a plan is always applied by the run that made it and
# main runs never interleave. Superseded PR runs are cancelled; main/dispatch runs queue
# (GitHub keeps only the newest queued run, which is fine: it contains the older commits).
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

# dev is provisioned locally and is intentionally not part of CI.
# Every job is generic: the matrix value `environment` (stg, prd) selects the directory,
# the GitHub environment (tf-<env>-plan / tf-<env>-apply) and the HCP Terraform workspace.
# Flow: validate + plan (all envs) -> apply stg -> apply prd. PRs stop after the plans.
jobs:
  # Environments to run, in apply order (a manual run targets only the chosen one).
  # Needed as a job because `strategy.matrix` cannot read the env context.
  config:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.envs.outputs.envs }}
    steps:
      - id: envs
        env:
          EVENT: ${{ github.event_name }}
          CHOSEN: ${{ inputs.environment }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "envs=[\"$CHOSEN\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'envs=["stg","prd"]' >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: validate ${{ matrix.environment }}
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.config.outputs.envs) }}
    defaults:
      run:
        working-directory: infra/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles(format('infra/{0}/.terraform.lock.hcl', matrix.environment)) }}
          restore-keys: tf-providers-${{ runner.os }}-${{ matrix.environment }}-
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive -diff ..
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    name: plan ${{ matrix.environment }}
    needs: [config, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.config.outputs.envs) }}
    environment: tf-${{ matrix.environment }}-plan
    defaults:
      run:
        working-directory: infra/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_TOKEN }}
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles(format('infra/{0}/.terraform.lock.hcl', matrix.environment)) }}
          restore-keys: tf-providers-${{ runner.os }}-${{ matrix.environment }}-
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform init
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Plan summary
        run: |
          {
            echo "### Plan: ${{ matrix.environment }}"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Only plans with changes are uploaded; apply skips an environment without one.
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.changes == 'true'
        with:
          name: tfplan-${{ matrix.environment }}
          path: infra/${{ matrix.environment }}/tfplan
          retention-days: 7

  apply:
    name: apply ${{ matrix.environment }}
    needs: [config, plan]
    # Only from main: on push, or on a manual run with "apply" ticked.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply))
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # sequential in list order: stg, then prd
      fail-fast: true # a failed apply stops the remaining environments
      matrix:
        environment: ${{ fromJSON(needs.config.outputs.envs) }}
    environment: tf-${{ matrix.environment }}-apply
    defaults:
      run:
        working-directory: infra/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: plan
        continue-on-error: true # no artifact means no changes for this environment
        with:
          name: tfplan-${{ matrix.environment }}
          path: infra/${{ matrix.environment }}
      - uses: hashicorp/setup-terraform@v3
        if: steps.plan.outcome == 'success'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_TOKEN }}
      - name: Cache Terraform providers
        if: steps.plan.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles(format('infra/{0}/.terraform.lock.hcl', matrix.environment)) }}
          restore-keys: tf-providers-${{ runner.os }}-${{ matrix.environment }}-
      - name: Apply
        if: steps.plan.outcome == 'success'
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init
          terraform apply tfplan
      - name: Nothing to apply
        if: steps.plan.outcome != 'success'
        run: echo "No changes planned for ${{ matrix.environment }}."
