name: CLI node

on:
  push:
    branches: [main]
    paths: ["src/cli-node/**", "src/gateway/proto/**", ".github/workflows/cli-node.yaml"]
  pull_request:
    paths: ["src/cli-node/**", "src/gateway/proto/**", ".github/workflows/cli-node.yaml"]
  workflow_dispatch:

concurrency:
  group: cli-node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Verification only (no archive, no release): cargo fmt, clippy and tests (which also load the real LiteRT-LM library and
# resolve every function the node calls), plus shellcheck on the install script. Archives are built by
# cli-node-release.yaml on a cli-node-vX.Y.Z tag.
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
        working-directory: src/cli-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src/cli-node -> target"

      - name: Fetch the LiteRT-LM library
        run: python scripts/fetch-litert.py
      # Lints run once, on Linux x64 (clippy is the slowest step on Windows); tests run everywhere.
      - run: cargo fmt --check
        if: matrix.platform == 'ubuntu-22.04'
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.platform == 'ubuntu-22.04'
      - run: cargo test

      - name: Check the install script
        if: matrix.platform == 'ubuntu-22.04'
        run: shellcheck install.sh
