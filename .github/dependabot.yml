# .github/dependabot.yml
version: 2

# Public Helm repos that Dependabot's egress proxy blocks unless declared here.
registries:
  helm-dex:
    type: helm-registry
    url: https://charts.dexidp.io
  helm-groundhog2k:
    type: helm-registry
    url: https://groundhog2k.github.io/helm-charts
  helm-derwitt:
    type: helm-registry
    url: https://charts.derwitt.dev

updates:
  # ---------- pnpm projects (the "npm" ecosystem covers pnpm lockfiles) ----------
  - package-ecosystem: npm
    directories:
      - /src/ui
      - /src/web-node
      - /src/desktop-node
      - /src/control-plane
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: "deps"

  # Mobile node: Expo SDK pins react / react-native / expo-* together,
  # so majors are bumped by hand with an SDK upgrade.
  - package-ecosystem: npm
    directory: /src/mobile-node
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: "expo-*"
        update-types: [version-update:semver-major]
      - dependency-name: react
      # Pinned to the exact versions the Expo SDK expects (`expo install --check`);
      # bump them with `expo install --fix` when upgrading the SDK.
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-svg
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: typescript
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "react-native-*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, mobile-node]
    commit-message:
      prefix: "deps(mobile)"

  # ---------- Rust ----------
  - package-ecosystem: cargo
    directories:
      - /src/gateway
      - /src/cli-node
      - /src/desktop-node/src-tauri
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # keep the Tauri crates and JS packages moving together
      tauri:
        patterns: ["tauri", "tauri-*"]
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps"

  # ---------- Docker (Dockerfile and Dockerfile.dev) ----------
  - package-ecosystem: docker
    directories:
      - /src/ui
      - /src/web-node
      - /src/control-plane
      - /src/gateway
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Bucharest
    groups:
      docker-base-images:
        patterns: ["*"]
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps(docker)"

  # ---------- GitHub Actions (all release/CI workflows) ----------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  # ---------- Helm chart dependencies (Traefik, cert-manager, Dex, Postgres, ...) ----------
  - package-ecosystem: helm
    directory: /chart
    registries:
      - helm-dex
      - helm-groundhog2k
      - helm-derwitt
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 3
    labels: [dependencies, chart]
    commit-message:
      prefix: "deps(chart)"
